[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genoexpsurv"
version = "0.2.0"
description = "Panel-aware multimodal learning for explainable survival prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4",
  "torch>=2.2", "matplotlib>=3.7", "joblib>=1.3", "PyYAML>=6.0",
  "xgboost>=2.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
genoexpsurv = "GenoExpSurv_main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["GenoExpSurv_models", "GenoExpSurv_main", "seed", "util"]
